<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alpine.js Playground: Form</title>

    <!-- Compiled Tailwind -->
    <!-- <link rel="stylesheet" href="./dist/output.css" /> -->

    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet" />

    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="index.js"></script>
  </head>
  <body>
    <form x-data="signupForm" @submit.prevent="submitForm($event)">
      <h1>Ninja Signup Form</h1>

      <!-- username -->
      <div class="form-field">
        <p class="hint" x-bind:class="{'warning': username.length > 10}">
          <span x-text="15 - username.length"></span> characters remaining
        </p>

        <label>
          <span></span>Username:
          <input type="text" maxlength="15" x-model="username" />
        </label>
        <template x-if="errors.username">
          <p x-text="errors.username" class="error"></p>
        </template>
      </div>

      <!-- password -->
      <div class="form-field password">
        <label>
          <span>Password:</span>
          <input
            :type="showPassword ? 'text' : 'password'"
            x-model="password" />
        </label>

        <button type="button" @click="showPassword = !showPassword">
          <span x-text="showPassword ? 'Hide' : 'Show'"></span>
        </button>

        <template x-if="errors.password">
          <p x-text="errors.password" class="error"></p>
        </template>
      </div>

      <!-- confirm password -->
      <div class="form-field">
        <label>
          <span>Confirm Password:</span>
          <input type="password" x-model="passwordConfirm" />
        </label>

        <template x-if="errors.passwordConfirm">
          <p x-text="errors.passwordConfirm" class="error"></p>
        </template>
      </div>

      <!-- belt color -->
      <div class="form-field">
        <label
          >Belt Color:
          <select x-model="belt">
            <option value="">Select a belt</option>

            <template x-for="(color, index) in beltColors" :key="color">
              <option :value="color" x-text="color"></option>
            </template>
          </select>
        </label>

        <template x-if="errors.belt">
          <p x-text="errors.belt" class="error"></p>
        </template>
      </div>

      <!-- short bio -->
      <div class="form-field">
        <p class="hint" :class="{'warning': bio.length > 90}">
          <span x-text="100 - bio.length"></span> characters remaining
        </p>
        <label>
          <span>Short Bio:</span>
          <textarea maxlength="100" x-model="bio"></textarea>
        </label>

        <template x-if="errors.bio">
          <p x-text="errors.bio" class="error"></p>
        </template>
      </div>

      <!-- newsletter signup -->
      <div class="form-field newsletter">
        <label>
          <input type="checkbox" x-model="newsletter" />
          <span>Sign up for the newsletter</span>
        </label>
      </div>

      <!-- submit button -->
      <button type="submit">Submit</button>

      <!-- Modal -->
      <div
        class="overlay"
        x-show="success"
        x-cloak
        x-transition.opacity.duration.500ms>
        <div
          class="modal"
          x-show="success"
          x-transition:enter-start="off-screen"
          x-transition:enter-end="on-screen">
          <h2>Thank You!</h2>
          <button type="button" @click="success = false">Close</button>
        </div>
      </div>
    </form>
  </body>
</html>
