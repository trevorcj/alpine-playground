<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alpine.js Playground</title>

    <!-- Compiled Tailwind -->
    <link rel="stylesheet" href="./dist/output.css" />

    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="index.js"></script>
  </head>
  <body class="p-10">
    <div x-data="counter">
      <h1 class="text-2xl font-bold">Welcome, <span x-text="name"></span></h1>

      <p class="mt-3 text-lg">
        The current value of the count is: <span x-text="count"></span>
      </p>

      <button
        @click="count++; logCount()"
        class="mt-10 bg-mauve-950 text-white px-6 py-2.5 rounded-xl cursor-pointer transition-transform duration-150 active:scale-95">
        Increase count
      </button>
    </div>
  </body>
</html>
